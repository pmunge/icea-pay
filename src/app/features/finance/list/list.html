<section class="page">
    <header class="page-header">
        <div>
            <h1>Paybills Management</h1>
            <p>View, create, and manage paybills.</p>
        </div><button mat-flat-button color="primary" type="button"
            (click)="openCreateDialog()"><mat-icon>add</mat-icon>Create Paybill</button>
    </header>
    <mat-card class="product-card">
        <mat-form-field appearance="outline" class="search-field"><mat-label>Search paybills</mat-label><input matInput
                [(ngModel)]="searchTerm" (ngModelChange)="applySearch()"
                placeholder="MoMo, paybill, amount or status"><mat-icon matSuffix>search</mat-icon></mat-form-field>
        <div class="table-container">
            <table mat-table [dataSource]="pagedPaybills" class="product-table">
                <ng-container matColumnDef="MoMo">
                    <th mat-header-cell *matHeaderCellDef>MoMo</th>
                    <td mat-cell *matCellDef="let paybill">{{ paybill.MoMo }}</td>
                </ng-container><ng-container matColumnDef="paybill">
                    <th mat-header-cell *matHeaderCellDef>Paybill</th>
                    <td mat-cell *matCellDef="let paybill">{{ paybill.paybill }}</td>
                </ng-container><ng-container matColumnDef="amount">
                    <th mat-header-cell *matHeaderCellDef>Amount</th>
                    <td mat-cell *matCellDef="let paybill">{{ paybill.amount | number:'1.0-2' }}</td>
                </ng-container><ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef>Status</th>
                    <td mat-cell *matCellDef="let paybill"><span class="status"
                            [class.inactive]="paybill.status === 'Inactive'">{{ paybill.status }}</span></td>
                </ng-container><ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef>Actions</th>
                    <td mat-cell *matCellDef="let paybill">
                        <button mat-icon-button type="button" aria-label="Update amount"
                            (click)="openUpdateDialog(paybill)">
                            <mat-icon>edit</mat-icon>
                        </button>
                    </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>@if (!filteredPaybills.length) { <div class="empty-state">No paybills match your search.
            </div> }
        </div>
        <mat-paginator [length]="filteredPaybills.length" [pageIndex]="pageIndex" [pageSize]="pageSize"
            [pageSizeOptions]="pageSizeOptions" (page)="changePage($event)"
            aria-label="Paybills pagination"></mat-paginator>
    </mat-card>
</section>
