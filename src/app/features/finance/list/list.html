<section class="page">
    <header class="page-header">
        <div>
            <h1>Paybills Management</h1>
            <p>View, create, and manage paybills.</p>
        </div>
        <div class="page-header-actions">
            <button mat-flat-button color="primary" type="button"
                (click)="openCreateDialog()"><mat-icon>add</mat-icon>Create Paybill</button>
        </div>
    </header>
    <mat-card class="product-card">
        <mat-form-field appearance="outline" class="search-field"><mat-label>Search paybills</mat-label><input matInput
                [(ngModel)]="searchTerm" (ngModelChange)="applySearch()"
                placeholder="Paybill number, provider or country"><mat-icon
                matSuffix>search</mat-icon></mat-form-field>
        <div class="table-container">
            <table mat-table [dataSource]="pagedPaybills" class="product-table">
                <ng-container matColumnDef="index">
                    <th mat-header-cell *matHeaderCellDef>#</th>
                    <td mat-cell *matCellDef="let element; let i = index">{{ pageIndex * pageSize + i + 1 }}</td>
                </ng-container><ng-container matColumnDef="paybillNumber">
                    <th mat-header-cell *matHeaderCellDef>Paybill Number</th>
                    <td mat-cell *matCellDef="let paybill">{{ paybill.paybillNumber }}</td>
                </ng-container><ng-container matColumnDef="provider">
                    <th mat-header-cell *matHeaderCellDef>Provider</th>
                    <td mat-cell *matCellDef="let paybill">{{ paybill.provider }}</td>
                </ng-container><ng-container matColumnDef="countryCode">
                    <th mat-header-cell *matHeaderCellDef>Country Code</th>
                    <td mat-cell *matCellDef="let paybill">{{ paybill.countryCode }}</td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>@if (!filteredPaybills.length) { <div class="empty-state">No paybills match your search.
            </div> }
        </div>
        <mat-paginator [length]="filteredPaybills.length" [pageIndex]="pageIndex" [pageSize]="pageSize"
            [pageSizeOptions]="pageSizeOptions" (page)="changePage($event)"
            aria-label="Paybills pagination"></mat-paginator>
    </mat-card>
</section>
