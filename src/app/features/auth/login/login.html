<div class="login-layout">

  <!-- Left: form panel -->
  <section class="login-panel">
    <header class="brand">
      <img src="/static/images/logo.png" alt="ICEA LION" class="brand-logo">
      <span class="brand-name">ICEA LION</span>
    </header>

    <div class="form-wrap">
      <img src="/static/images/loginlogo.png" alt="ICEA LION" class="product-logo">
      <p class="subtitle">Sign in to access the Insurance portal</p>

      <form [formGroup]="loginForm" (ngSubmit)="submit()" class="login-form" novalidate>

        <label class="field">
          <span class="field-label">Email</span>
          <input type="email" formControlName="email" placeholder="Enter your email" autocomplete="email">
          @if (loginForm.controls.email.touched && loginForm.controls.email.invalid) {
          <span class="field-error">Enter a valid email</span>
          }
        </label>

        <label class="field">
          <span class="field-label">Password</span>
          <input type="password" formControlName="password" placeholder="••••••••••" autocomplete="current-password">
          @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
          <span class="field-error">Password is required</span>
          }
        </label>

        @if (errorMessage()) {
        <p class="form-error">{{ errorMessage() }}</p>
        }

        <button type="submit" class="btn btn-primary" [disabled]="loading()">
          {{ loading() ? 'Signing in…' : 'Sign In' }}
        </button>

      </form>
    </div>
  </section>

  <!-- Right: image panel -->
  <aside class="image-panel">
    <img src="/static/images/login.png" alt="ICEA LION headquarters" class="image-panel-bg">
    <div class="image-overlay">
      <span class="overlay-top">ICEA LION</span>
      <div class="overlay-bottom">
        <h2 class="overlay-heading">Insurance Portal</h2>
        <p class="overlay-text">
          Manage products, branches, channels and transactions across the group
          from a single secure dashboard.
        </p>
      </div>
    </div>
  </aside>

</div>
