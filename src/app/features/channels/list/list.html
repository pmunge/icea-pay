<section class="page">
  <header class="page-header">
    <div>
      <h1>Channels</h1>
      <p>Manage the channels through which transactions access products.</p>
    </div><button mat-flat-button color="primary" type="button" (click)="openCreateDialog()"><mat-icon>add</mat-icon>Add
      channel</button>
  </header>
  <mat-card class="product-card">
    <mat-form-field appearance="outline" class="search-field"><mat-label>Search channels</mat-label><input matInput
        [(ngModel)]="searchTerm" (ngModelChange)="applySearch()"
        placeholder="Name, category, description or status"><mat-icon matSuffix>search</mat-icon></mat-form-field>
    <div class="table-container">
      <table mat-table [dataSource]="pagedChannels" class="product-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Channel</th>
          <td mat-cell *matCellDef="let channel"><strong>{{ channel.name }}</strong></td>
        </ng-container><ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef>Category</th>
          <td mat-cell *matCellDef="let channel">{{ channel.category }}</td>
        </ng-container><ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let channel" class="description-cell">{{ channel.description }}</td>
        </ng-container><ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let channel"><span class="status"
              [class.inactive]="channel.status === 'Inactive'">{{ channel.status }}</span></td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>@if (!filteredChannels.length) { <div class="empty-state">No channels match your search.</div> }
    </div>
    <mat-paginator [length]="filteredChannels.length" [pageIndex]="pageIndex" [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions" (page)="changePage($event)" aria-label="Channels pagination"></mat-paginator>
  </mat-card>
</section>
