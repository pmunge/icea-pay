<section class="page">
  <header class="page-header">
    <div>
      <h1>Profiles</h1>
      <p>Manage the profiles available across the portal.</p>
    </div><button mat-flat-button color="primary" type="button" (click)="openCreateDialog()"><mat-icon>add</mat-icon>Add
      profile</button>
  </header>
  <mat-card class="product-card">
    <mat-form-field appearance="outline" class="search-field"><mat-label>Search profiles</mat-label><input matInput
        [(ngModel)]="searchTerm" (ngModelChange)="applySearch()"
        placeholder="Profile name"><mat-icon matSuffix>search</mat-icon></mat-form-field>
    <div class="table-container">
      <table mat-table [dataSource]="pagedProfiles" class="product-table">
        <ng-container matColumnDef="profile">
          <th mat-header-cell *matHeaderCellDef>Profile</th>
          <td mat-cell *matCellDef="let profile"><strong>{{ profile.profile }}</strong></td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>@if (!filteredProfiles.length) { <div class="empty-state">No profiles match your search.</div> }
    </div>
    <mat-paginator [length]="filteredProfiles.length" [pageIndex]="pageIndex" [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions" (page)="changePage($event)" aria-label="Profiles pagination"></mat-paginator>
  </mat-card>
</section>
